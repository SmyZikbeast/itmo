limit: 2000

memory_size: 0x500

memory_mapped_io:

  0x80: [83, 97, 110, 99, 104, 101, 122, 10]

  0x84: []

reports:

  - name: Step-by-step

    slice: all

    view: |

      {pc}:	{instruction:next}	{pc:label}

  - name: Result

    slice: last

    view: |

      numio[0x80]: {io:0x80:dec}

      numio[0x84]: {io:0x84:dec}

    assert: |

      numio[0x80]: [] >>> []

      numio[0x84]: [] >>> [87,104,97,116,32,105,115,32,121,111,117,114,32,110,97,109,101,63,10,72,101,108,108,111,44,32,83,97,110,99,104,101,122,33]